[workspace]
resolver = "2"

members = [
    "cli",
    "core",
    "desktop",
    "desktop/src-tauri",
    "desktop/crates/lib",
    "desktop/crates/resource_db",
    "desktop/crates/ui_components",
    "desktop/crates/editors",
    "desktop/crates/ui_lib",
    "desktop/crates/workspace_graph",
    "desktop/crates/workspace_db",
    "file_path_from_id",
    "has_id",
    "has_id/has_id_derive",
    "in_trash",
    "local",
	"local/fs_watcher",
	"local/fs_watcher/test_utils",
    "local/project_watcher",
    "local/project_watcher/cli",
	"local/simulator",
    "local/runner",
]

default-members = ["core"]

[workspace.dependencies]
syre-core = { path = "core" }
syre-local = { path = "local" }
syre-project-watcher = { path = "local/project_watcher" }
syre-fs-watcher = { path = "local/fs_watcher" }
syre-local-runner = { path = "local/runner" }
dev_utils = { path = "dev_utils" }
file_path_from_id = { path = "file_path_from_id" }
in_trash = { path = "in_trash" }
has_id = { path  = "has_id" }
io_error_serde = { git = "https://github.com/syre-data/io_error_serde.git" }

aquamarine = "0.6"
calamine = "0.26"
chrono = "0.4"
clap = "4.5"
crossbeam = "0.8"
csv = "1.3"
derive_more = "2.0"
directories = "6.0"
futures = "0.3"
glob = "0.3" 
ignore = "0.4"
indexmap = "2.7"
notify = { version = "8.0", default-features = false }
notify-debouncer-full = { version = "0.5", default-features = false }
rayon = "1.8"
regex = "1.11"
serde = "1.0"
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
thiserror = "2.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
trash = "5.2"
uuid = "1.15"
walkdir = "2.5"
zmq = "0.10.0"

# desktop
icondata = "0.5"
js-sys = "0.3"
leptos = { version = "0.8.0-beta", features = ["nightly", "csr"] }
# leptos_icons = { git = "https://github.com/carloskiki/leptos-icons" }
leptos_icons = { path = "../leptos-icons" }
leptos_router = { version = "0.8.0-beta" }
leptos-use = { git = "https://github.com/Synphonyte/leptos-use.git", branch = "main" }
reactive_stores = "0.2.0-beta"
tauri-sys = { git = "https://github.com/JonasKruckenberg/tauri-sys", branch = "v2" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# dev dependencies
fake = "4.0"
rand = "0.9"
tempfile = "3.14"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false

[profile.release.package.syre-resource-db]
strip = true
opt-level = 3
codegen-units = 1
# lto = true
# BUG: Should have `lto = true` but this cannot currently be used.
# See https://github.com/rust-lang/cargo/issues/9330

# panic = 'abort'
# BUG: Should have `panic = abort` but this cannot currently be used.
# See https://github.com/rust-lang/cargo/issues/8264
