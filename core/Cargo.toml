[package]
name = "syre-core"
version = "0.10.2"
edition = "2024"

authors = [ "Brian Carlsen <carlsen.bri@gmail.com>" ]
description = "Core functionality and types for Syre data management and analysis software."
license = "MIT OR Apache-2.0"

homepage = "https://syre.ai"
repository = "https://github.com/syre-data/syre"
keywords = [ "syre", "syre-data", "data", "data-analysis", "data-management" ]
categories = [ "science", "data-structures" ]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aquamarine = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, optional = true }
derivative = "2.2"
derive_more = { workspace = true, features = ["from"] }
directories.workspace = true
indexmap = { workspace = true, features = ["serde"] }
io_error_serde.workspace = true
rayon = { workspace = true, optional = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, features = ["serde", "v4"] }
validator = "0.21"

has_id = { path = "../has_id", features = ["derive"] }

[dev-dependencies]
rand.workspace = true
fake.workspace = true
lazy_static = "1.4"
tempfile = { workspace = true }
test-log = { version = "0.2", features = ["trace"] }

[features]
default = ["project", "runner", "system", "db"]
db = ["project"]
project = []
runner = ["project", "dep:serde", "dep:rayon", "indexmap/rayon"]
system = []
serde = ["dep:serde", "serde/rc", "has_id/serde"]
clap = ["dep:clap"]
js = ["uuid/js"]
tracing = ["dep:tracing"]
