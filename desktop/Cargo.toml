[package]
name = "syre-desktop-ui"
version = "0.11.9"
edition = "2024"

authors = ["Brian Carlsen <carlsen.bri@gmail.com>"]
description = "Syre desktop application."

homepage = "https://syre.ai"
repository = "https://github.com/syre-data/syre"
keywords = ["syre", "syre-data", "data", "data-analysis", "data-management"]
categories = ["gui", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
chrono = { workspace = true, features = ["serde"] }
codee = "0.3"
console_error_panic_hook = "0.1.7"
derive_more = { workspace = true, features = ["debug"] }
futures.workspace = true
has_id.workspace = true
js-sys.workspace = true
leptos.workspace = true
leptos_icons.workspace = true
leptos_meta = { version = "0.8" }
leptos_router = { workspace = true, features = ["nightly"] }
leptos-use = { workspace = true, features = ["storage"] }
reactive_stores.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
syre-core = { workspace = true, features = ["serde"] }
syre-desktop-lib = { path = "crates/lib" }
syre-desktop-ui-lib = { path = "crates/ui_lib" }
syre-desktop-ui-components = { path = "crates/ui_components" }
syre-local.workspace = true
syre-project-daemon.workspace = true
syre-desktop-editors ={ path = "crates/editors" }
syre-desktop-resource-db = { path = "crates/resource_db", default-features = false }
syre-desktop-workspace-db = { path = "crates/workspace_db" }
syre-desktop-workspace-graph = { path = "crates/workspace_graph" }
tauri-sys = { workspace = true, features = [
	"app",
	"core",
	"event",
	"menu",
	"window",
] }
time = { version = "0.3", features = ["wasm-bindgen"] }
tracing-subscriber = { workspace = true, features = ["time"] }
tracing-web = "0.1.3"
tracing.workspace = true
uuid = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[dependencies.icondata]
workspace = true
features = [
	"bootstrap-icons",
	"font-awesome",
	"ionicons",
	"lucide",
]

[dependencies.web-sys]
workspace = true
features = [
	"AbortController",
	"AbortSignal",
	"AddEventListenerOptions",
	"CssStyleDeclaration",
	"DomRect",
	"Element",
	"Event",
	"EventInit",
	"EventTarget",
	"FocusEvent",
	"HtmlCollection",
	"HtmlDialogElement",
	"HtmlDivElement",
	"HtmlElement",
	"HtmlInputElement",
	"HtmlOptionElement",
	"HtmlSelectElement",
	"HtmlSpanElement",
	"InputEvent",
	"Performance",
	"ResizeObserver",
	"ResizeObserverBoxOptions",
	"ResizeObserverEntry",
	"ResizeObserverOptions",
	"ResizeObserverSize",
	"SvgElement",
	"SvgGraphicsElement",
	"SvgMatrix",
]

[features]
tracing = [
	"leptos/tracing", 
	"syre-desktop-workspace-graph/tracing",
	"syre-desktop-workspace-db/tracing",
]
perf = ["tracing"]
