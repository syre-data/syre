[package]
name = "syre-desktop-ui-lib"
version = "0.0.0"
edition = "2024"

[dependencies]
chrono = { workspace = true, features = ["serde"] }
derive_more.workspace = true
js-sys.workspace = true
leptos.workspace = true
leptos_icons.workspace = true
reactive_stores.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
syre-core = { workspace = true, features = ["serde"] }
syre-desktop-lib ={ path = "../lib"}
syre-local.workspace = true
syre-project-daemon.workspace = true
tauri-sys = { workspace = true, features = ["core"] }
web-sys = { workspace = true, features = ["Window"] }

[dependencies.icondata]
workspace = true
default-features = false
features = [
    "ant-design-icons",
    "bootstrap-icons",
    "font-awesome",
    "ionicons",
    "lucide",
    "github-octicons",
    "tabler-icons",
    "vs-code-icons",
] 