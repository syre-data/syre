[package]
name = "syre-desktop"
version = "0.11.3"
description = "Syre desktop application."
authors = ["Brian Carlsen <carlsen.bri@gmail.com>"]
edition = "2024"

homepage = "https://syre.ai"
repository = "https://github.com/syre-data/syre"
keywords = ["syre", "syre-data", "data", "data-analysis", "data-management"]
categories = ["gui", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
derive_more.workspace = true
directories.workspace = true
ignore.workspace = true
open = "5.3.0"
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
syre-core = { workspace = true, features = ["serde"] }
syre-local = { workspace = true, features = ["fs"] }
syre-project-watcher = { workspace = true, features = ["client"] }
syre-local-runner = { workspace = true }
syre-desktop-lib = { path = "../src-lib", features = ["server"] }
syre-resource-db = { path = "../resource_db" }
tauri = { version = "2.2", features = [] }
tauri-plugin-dialog = "2.2"
tauri-plugin-devtools = { git = "https://github.com/crabnebula-dev/devtools" }
tauri-plugin-shell = "2.2"
tempfile.workspace = true
tokio = { version = "1.42", features = ["full"] }
tokio-stream = { version = "0.1", features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json", "time"] }
tracing-appender.workspace = true
trash.workspace = true
uuid.workspace = true
walkdir.workspace = true
zmq.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[features]
no-auto-update = []





